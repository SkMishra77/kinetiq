[project]
name = "kinetiq"
version = "0.1.0"
description = "Personal AI trainer memory as a remote MCP server for claude.ai"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastmcp>=4.0.5,<5",
  "pydantic>=2.7",
  "pydantic-settings>=2.5",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "rapidfuzz>=3.9",
  "uvicorn>=0.30",
  "typer>=0.12",
  "python-dateutil>=2.9",
  "tzdata>=2024.1",
]

[project.scripts]
kinetiq = "kinetiq.cli:app"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["integration: exercises live external services", "network: requires network access"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E","F","W","I","B","UP","SIM","N","PL"]
ignore = ["E501","PLR0913","PLR0912","PLR2004","PLR0915"]

[tool.mypy]
python_version = "3.12"
strict_optional = true
ignore_missing_imports = true
disallow_untyped_defs = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kinetiq"]
