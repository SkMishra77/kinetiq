# Kinetiq exercise seed library.
# Each entry produces one row in `exercises` and rows in `exercise_aliases`.
# `selection_scores` are 1-5 by goal (used by compare_exercises); values are
# rules-of-thumb by movement-science consensus, not gospel. Every entry with
# specific claim text carries a citation elsewhere (principles.yaml + inline
# evidence_summary sentences); citations here are optional.
# ---------------------------------------------------------------------------

- slug: barbell-bench-press
  name: Barbell Bench Press
  movement_pattern: horizontal_push
  equipment: barbell
  load_type: external
  laterality: bilateral
  primary_muscles: [chest]
  secondary_muscles: [triceps, front_delts]
  is_compound: true
  default_increment_kg: 2.5
  default_rest_s: 180
  aliases: [bench, bench press, bb bench, flat bench, barbell bench]
  cues: "Squeeze scapulae, feet planted, mild arch; bar-path from mid-chest to shoulders."
  contraindication_tags: [shoulder_impingement, wrist_flexion_pain]
  evidence_summary: "Compound press with high loading potential; strong hypertrophy for chest with heavy sets and moderate reps."
  selection_scores: {muscle_gain: 5, strength: 5, fat_loss: 3, general_fitness: 4, aesthetic_vtaper: 4, aesthetic_balanced: 5, classic_physique: 5}

