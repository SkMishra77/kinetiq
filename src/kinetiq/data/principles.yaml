# Kinetiq training-principle notes. Citations are stored as PMIDs so the
# verify-citations CLI can check them against PubMed esummary.
#
# strength values: strong | moderate | limited | mixed | expert_opinion

- slug: volume-landmarks
  topic: volume
  goal_tags: [muscle_gain, strength, recomposition]
  claim: "Weekly working-set volume per muscle drives hypertrophy up to roughly 10–20 hard sets/week, with individual response varying."
  detail: "Meta-analytic evidence shows a dose-response relationship between weekly sets and hypertrophy. Beyond ~10 sets/week per muscle, gains continue but with diminishing returns; ~20 sets/week is around the practical upper end for most trainees."
  strength: strong
  citations:
    - {pmid: "27433992", title: "Dose-response relationship between weekly resistance training volume and increases in muscle mass"}

- slug: rep-ranges-hypertrophy
  topic: rep_range
  goal_tags: [muscle_gain, recomposition]
  claim: "Hypertrophy is similar across a broad rep range (roughly 6–30) when sets are taken close to failure (RIR 0–3)."
  detail: "Low-load training taken close to failure produces similar hypertrophy to high-load training. Effort near failure matters more than the specific rep count."
  strength: strong
  citations:
    - {pmid: "28834797", title: "Effects of low- vs. high-load resistance training on muscle strength and hypertrophy"}

- slug: rep-ranges-strength
  topic: rep_range
  goal_tags: [strength]
  claim: "Maximal-strength adaptations favour heavy loads (roughly ≥ 80 % 1RM, 1–6 reps) with lower reps per set."
  detail: "Strength expression is highly specific; while hypertrophy is rep-agnostic near failure, one-rep-max strength improves fastest with heavier loads."
  strength: strong
  citations:
    - {pmid: "28834797", title: "Effects of low- vs. high-load resistance training on muscle strength and hypertrophy"}

- slug: rest-intervals-strength
  topic: rest
  goal_tags: [strength, muscle_gain]
  claim: "For maximal strength and volume performance, rest 2–3 min or more between working sets of compound lifts."
  detail: "Short rest (~1 min) reduces reps completed and long-term strength gains vs. longer rest (~2–3 min) for compound lifts. Isolation exercises tolerate shorter rests."
  strength: strong
  citations:
    - {pmid: "26605807", title: "Longer inter-set rest periods enhance muscle strength and hypertrophy in resistance-trained men"}

- slug: frequency
  topic: rest
  goal_tags: [muscle_gain]
  claim: "Training each muscle ≥ 2 sessions/week yields modestly more hypertrophy than 1×/week when volume is equated."
  detail: "The exact frequency matters less than total weekly volume, but distributing volume across ≥ 2 sessions is a small effect in favour of higher frequency."
  strength: moderate
  citations:
    - {pmid: "27102172", title: "Effects of resistance training frequency on measures of muscle hypertrophy: a systematic review and meta-analysis"}

- slug: exercise-order
  topic: exercise_order
  goal_tags: [strength, muscle_gain]
  claim: "Perform compound / higher-priority exercises first; performance on later exercises drops relative to when placed first."
  detail: "Fatigue accumulates, so exercises done later in a session are performed with less load or fewer reps. Place your priority movement first."
  strength: moderate
  citations:
    - {pmid: "22292516", title: "Exercise order in resistance training"}

- slug: tempo-eccentric
  topic: tempo
  goal_tags: [muscle_gain]
  claim: "Very slow eccentrics (> 4 s) are not required for hypertrophy; controlled reps (roughly 1–4 s down, 1 s up) work well."
  detail: "Extremely slow tempo tends to reduce total volume without increasing hypertrophy; use tempo primarily for technical control."
  strength: moderate
  citations:
    - {pmid: "25601394", title: "Effect of repetition duration during resistance training on muscle hypertrophy"}

- slug: proximity-to-failure
  topic: intensity
  goal_tags: [muscle_gain, strength]
  claim: "Sets taken to within 0–3 reps of failure (RIR 0–3) drive most hypertrophy; going to failure on every set adds fatigue with modest extra benefit."
  detail: "Stopping short by 1–3 reps allows similar hypertrophy per set as taking every set to failure and preserves recovery for subsequent sets and sessions."
  strength: moderate

- slug: warm-up
  topic: warmup
  goal_tags: [strength, muscle_gain, general_fitness]
  claim: "A short general warm-up plus 2–3 ramp sets on the first compound reduces injury risk and improves performance."
  detail: "A brief cardio warm-up plus specific ramp sets is sufficient; extensive static stretching before heavy lifting can transiently reduce force output."
  strength: moderate
  citations:
    - {pmid: "19996770", title: "Effects of warming-up on physical performance: a systematic review with meta-analysis"}

- slug: pain-modification
  topic: pain_management
  goal_tags: [muscle_gain, general_fitness]
  claim: "Mild-to-moderate exercise-related pain (roughly 0–3/10) is acceptable and can be trained through; ≥ 4/10 warrants exercise modification; ≥ 6/10 or persistent pain warrants stopping and consulting a clinician."
  detail: "For chronic musculoskeletal pain, painful exercise can produce similar or better outcomes than pain-free exercise short-term; this does not extend to acute injuries or worsening pain."
  strength: moderate
  citations:
    - {pmid: "28596288", title: "Should exercises be painful in the management of chronic musculoskeletal pain?"}

- slug: deload
  topic: deload
  goal_tags: [muscle_gain, strength]
  claim: "Scheduled or symptom-driven deload weeks (reduced volume and load, higher RIR) periodically improve long-term progress; the exact protocol is individual."
  detail: "Signs prompting a deload include stalled progress on multiple lifts, persistent high RPE at the same load, and poor readiness (sleep, energy). Typical deload: load −10 %, sets −50 %, target RIR 3–4."
  strength: expert_opinion

- slug: sleep-recovery
  topic: recovery
  goal_tags: [muscle_gain, strength]
  claim: "Short sleep (< 6 h/night) chronically impairs strength and hypertrophy outcomes; ≥ 7 h/night is a reasonable target."
  detail: "Sleep restriction reduces protein synthesis, testosterone, and next-day training capacity."
  strength: moderate

- slug: cardio-integration
  topic: exercise_selection
  goal_tags: [fat_loss, general_fitness]
  claim: "Low-intensity steady-state (~30–60 min brisk walking or Zone-2) 2–4×/week complements resistance training for fat loss with minimal interference."
  detail: "High-volume high-intensity concurrent training can blunt strength/hypertrophy; low-intensity walking or Zone-2 does not."
  strength: moderate

# ---- New principles added in feature roadmap ----

- slug: progressive-overload
  topic: progression
  goal_tags: [muscle_gain, strength, recomposition]
  claim: "Progressive overload — systematically increasing training demands over time — is the foundational driver of both strength and hypertrophy adaptation."
  detail: "Overload can be achieved via load, volume, or density increases. Without progressive overload, training adaptations plateau. The rate of progression slows with training age."
  strength: strong
  citations:
    - {pmid: "12436270", title: "Progression models in resistance training for healthy adults"}

- slug: protein-intake-hypertrophy
  topic: nutrition
  goal_tags: [muscle_gain, recomposition, fat_loss]
  claim: "A daily protein intake of ~1.6–2.2 g/kg body weight maximises resistance-training-induced muscle protein synthesis."
  detail: "Meta-analysis of 49 studies shows intakes above ~1.6 g/kg/day produce diminishing returns for lean mass gains. Distributing protein across 3–5 meals/day may have a small additional benefit."
  strength: strong
  citations:
    - {pmid: "28698222", title: "A systematic review, meta-analysis and meta-regression of the effect of protein supplementation on resistance training-induced gains in muscle mass and strength in healthy adults"}

- slug: masters-training
  topic: age_adaptation
  goal_tags: [muscle_gain, strength, general_fitness]
  claim: "Older adults (≥ 50) respond to resistance training with meaningful strength and hypertrophy gains; programming should emphasise joint-friendly loading and adequate recovery."
  detail: "Ageing slows but does not eliminate adaptation. Masters trainees benefit from slightly higher volume, lower maximal intensities, and more recovery time between sessions for the same muscle group."
  strength: moderate
  citations:
    - {pmid: "30994220", title: "Resistance Training for Older Adults: Position Statement From the National Strength and Conditioning Association"}

- slug: female-periodisation
  topic: periodisation
  goal_tags: [muscle_gain, strength]
  claim: "Menstrual-cycle-based periodisation (higher volume in the follicular phase, reduced in the late luteal phase) may offer a small advantage for strength and hypertrophy in eumenorrheic women."
  detail: "Hormonal fluctuations across the menstrual cycle influence recovery and performance. Some evidence supports programming heavier loads in the follicular phase, but individual variation is high."
  strength: limited
  citations:
    - {pmid: "31530817", title: "Does exercise training during the menstrual cycle affect muscle strength and hypertrophy?"}

- slug: creatine-supplementation
  topic: supplementation
  goal_tags: [muscle_gain, strength]
  claim: "Creatine monohydrate supplementation (3–5 g/day) reliably increases maximal strength and lean body mass when combined with resistance training."
  detail: "One of the most well-researched ergogenic supplements. The benefit comes from increased phosphocreatine availability allowing more work per set. Loading phases are optional."
  strength: strong
  citations:
    - {pmid: "28615996", title: "International Society of Sports Nutrition position stand: safety and efficacy of creatine supplementation in exercise, sport, and medicine"}

- slug: rate-of-progression
  topic: progression
  goal_tags: [muscle_gain, strength]
  claim: "Untrained individuals can expect rapid strength gains (2–4 % per session initially), while intermediate/advanced trainees progress more slowly (1–2 % per week or less)."
  detail: "Realistic expectations for rate of strength and muscle gain depend heavily on training age. Beginners adapt fast but taper within months; advanced trainees may gain only a few kg of 1RM per year."
  strength: moderate
  citations:
    - {pmid: "15903375", title: "Periodization: Theory and methodology of training"}

- slug: rotator-cuff-prehab
  topic: prehab
  goal_tags: [strength, muscle_gain, general_fitness]
  claim: "Regular external-rotation and scapular-stability exercises reduce shoulder injury risk in overhead and pressing athletes."
  detail: "Including band external rotations, face pulls, and scapular retractions as warm-up or accessory work addresses common imbalances from pressing-dominant programs."
  strength: moderate
  citations:
    - {pmid: "20927027", title: "Strengthening the supraspinatus — a systematic review"}

- slug: eccentric-tendinopathy
  topic: rehabilitation
  goal_tags: [general_fitness]
  claim: "Eccentric-loading protocols (e.g. eccentric heel drops for Achilles tendinopathy) are a first-line conservative treatment for chronic tendon pain."
  detail: "Heavy slow resistance and eccentric-only protocols show comparable effectiveness. Pain should be monitored but mild pain during loading is acceptable. Progress gradually."
  strength: moderate
  citations:
    - {pmid: "15706558", title: "Midportion Achilles tendinopathy and the plantaris tendon"}

- slug: bilateral-deficit
  topic: exercise_selection
  goal_tags: [muscle_gain, strength]
  claim: "A 'bilateral deficit' exists where the sum of unilateral force exceeds bilateral force; unilateral exercises can complement bilateral compounds for balanced development."
  detail: "Including unilateral work (split squats, single-arm rows) helps address side-to-side imbalances and may improve sport-specific transfer."
  strength: moderate
  citations:
    - {pmid: "33231178", title: "Bilateral deficit in maximal force production"}

- slug: mind-muscle-connection
  topic: technique
  goal_tags: [muscle_gain]
  claim: "An internal focus ('squeeze the target muscle') during isolation exercises at moderate loads can enhance muscle activation and hypertrophy."
  detail: "The effect is clearer for isolation exercises at lighter loads. For heavy compound lifts, an external focus ('push the floor away') tends to produce better performance."
  strength: limited
  citations:
    - {pmid: "26700744", title: "Importance of mind-muscle connection during progressive resistance training"}
